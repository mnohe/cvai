stages:
  - test
  - publish

test-core-web:
  stage: test
  image: node:22
  script:
    - cd core-web
    - npm ci
    - npm run check
    - npm test
    - npm run pack:dry-run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish-core-web:
  stage: publish
  image: node:22
  before_script:
    - cd core-web
    - echo "@cvai:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "${CI_API_V4_URL#https://}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
  script:
    - npm ci
    - npm run check
    - npm test
    - npm publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^core-web-v[0-9]+\\.[0-9]+\\.[0-9]+$/'
